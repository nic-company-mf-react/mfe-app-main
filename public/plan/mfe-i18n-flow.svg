  <text x="978" y="578" text-anchor="middle" font-size="9.5" fill="#c7d2fe">react-i18next</text>
  <text x="978" y="594" text-anchor="middle" font-size="8.5" fill="#818cf8">requiredVersion: ^15.0.0</text>


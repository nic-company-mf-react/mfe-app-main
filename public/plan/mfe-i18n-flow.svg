  <text x="812" y="340" text-anchor="middle" font-size="8.5" fill="#92400e">common.json · main.json</text>

  <rect x="722" y="348" width="86" height="16" rx="4" fill="#fde68a"/>
  <text x="765" y="360" text-anchor="middle" font-size="9" fill="#78350f">en/</text>
  <rect x="722" y="368" width="180" height="13" rx="3" fill="#fef3c7"/>
  <text x="812" y="378" text-anchor="middle" font-size="8.5" fill="#92400e">common.json · main.json</text>


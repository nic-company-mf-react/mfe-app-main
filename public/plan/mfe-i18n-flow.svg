  <text x="813" y="303" text-anchor="middle" font-size="9" fill="#b45309">i18next-http-backend 처리</text>

  <rect x="722" y="310" width="86" height="16" rx="4" fill="#fde68a"/>
  <text x="765" y="322" text-anchor="middle" font-size="9" fill="#78350f">ko/</text>

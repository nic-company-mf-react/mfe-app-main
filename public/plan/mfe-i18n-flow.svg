  <text x="150" y="133" text-anchor="middle" font-size="10" fill="#bfdbfe">index.html 로드</text>

  <!-- 아래 화살표 -->
  <line x1="150" y1="148" x2="150" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════
       STEP 2 : LanguageDetector
       ══════════════════════════════════════════ -->
  <rect x="60" y="176" width="180" height="58" rx="8" fill="#7c3aed"/>
  <text x="150" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="white">LanguageDetector</text>
  <text x="150" y="215" text-anchor="middle" font-size="9" fill="#ddd6fe">브라우저 언어 자동 감지</text>
  <text x="150" y="228" text-anchor="middle" font-size="9" fill="#ddd6fe">localStorage / navigator</text>


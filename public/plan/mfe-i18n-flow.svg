  <text x="279" y="869" text-anchor="middle" font-size="8.5" fill="#6d28d9">동일 인스턴스 반응</text>
  <text x="279" y="881" text-anchor="middle" font-size="8" fill="#7c3aed">별도 설정 불필요</text>


  <text x="130" y="324" text-anchor="middle" font-size="9" fill="#78350f">i18n (mfe-lib-shared)</text>
  <text x="130" y="337" text-anchor="middle" font-size="9" fill="#78350f">HttpBackend plugin</text>
  <text x="130" y="350" text-anchor="middle" font-size="9" fill="#78350f">LanguageDetector plugin</text>
  <text x="130" y="362" text-anchor="middle" font-size="8" fill="#92400e">@axiom/mfe-lib-shared/i18n</text>

  <!-- Plugins 등록 박스 -->
  <rect x="230" y="292" width="168" height="76" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.2"/>
  <text x="314" y="310" text-anchor="middle" font-size="10" font-weight="bold" fill="#14532d">② Plugins 등록</text>
  <text x="314" y="324" text-anchor="middle" font-size="9" fill="#166534">i18n.use(HttpBackend)</text>
  <text x="314" y="337" text-anchor="middle" font-size="9" fill="#166534">i18n.use(LanguageDetector)</text>
  <text x="314" y="350" text-anchor="middle" font-size="9" fill="#166534">ns: ['common', 'main']</text>
  <text x="314" y="362" text-anchor="middle" font-size="8" fill="#166534">defaultNS: 'common'</text>

  <!-- init() 옵션 박스 -->
  <rect x="414" y="292" width="180" height="76" rx="6" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="504" y="310" text-anchor="middle" font-size="10" font-weight="bold" fill="#4c1d95">③ init() 옵션</text>
  <text x="504" y="324" text-anchor="middle" font-size="9" fill="#5b21b6">fallbackLng: 'ko'</text>
  <text x="504" y="337" text-anchor="middle" font-size="9" fill="#5b21b6">backend.loadPath:</text>
  <text x="504" y="349" text-anchor="middle" font-size="8.5" fill="#5b21b6">/locales/{lng}/{ns}.json</text>
  <text x="504" y="362" text-anchor="middle" font-size="8" fill="#7c3aed">.then() → React 렌더 시작</text>


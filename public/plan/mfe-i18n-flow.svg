  <rect x="30" y="646" width="580" height="24" rx="10" fill="#fff7ed"/>
  <rect x="30" y="658" width="580" height="12" fill="#fff7ed"/>
  <text x="320" y="663" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">[ STEP 6 ]  mfe-app-remote1 — Remote1App.tsx</text>


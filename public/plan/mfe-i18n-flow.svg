  <text x="658" y="312" text-anchor="middle" font-size="9" fill="#b45309">HTTP GET</text>
  <text x="658" y="334" text-anchor="middle" font-size="8" fill="#b45309">비동기 로딩</text>

  <rect x="706" y="268" width="214" height="160" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>

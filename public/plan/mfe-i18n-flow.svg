  <text x="510" y="720" text-anchor="middle" font-size="8.5" fill="#166534">t('키') 호출</text>
  <text x="510" y="734" text-anchor="middle" font-size="8.5" fill="#166534">공유 인스턴스 참조</text>
  <text x="510" y="746" text-anchor="middle" font-size="8" fill="#047857">네임스페이스: remote1</text>

  <!-- remote1 → 언어 전환 -->
  <line x1="320" y1="766" x2="320" y2="794" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ══════════════════════════════════════════
       STEP 7 : 런타임 언어 전환
       ══════════════════════════════════════════ -->
  <rect x="30" y="794" width="660" height="112" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

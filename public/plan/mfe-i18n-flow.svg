       ══════════════════════════════════════════ -->
  <rect x="30" y="262" width="580" height="118" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="30" y="262" width="580" height="24" rx="10" fill="#f0fdf4"/>
  <rect x="30" y="274" width="580" height="12" fill="#f0fdf4"/>
  <text x="320" y="279" text-anchor="middle" font-size="12" font-weight="bold" fill="#14532d">[ STEP 3 ]  Bootstrap.tsx — i18n.init()</text>


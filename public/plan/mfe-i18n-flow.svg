  <text x="132" y="720" text-anchor="middle" font-size="8.5" fill="#9a3412">src/locales/en/remote1.json</text>
  <text x="132" y="734" text-anchor="middle" font-size="8" fill="#b45309">빌드 번들 포함</text>
  <text x="132" y="746" text-anchor="middle" font-size="8" fill="#b45309">CORS 문제 회피</text>

  <!-- addResourceBundle -->
  <rect x="234" y="676" width="178" height="76" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2"/>
  <text x="323" y="694" text-anchor="middle" font-size="10" font-weight="bold" fill="#881337">네임스페이스 주입</text>
  <text x="323" y="708" text-anchor="middle" font-size="8.5" fill="#9f1239">i18n.addResourceBundle(</text>
  <text x="323" y="720" text-anchor="middle" font-size="8.5" fill="#9f1239">'ko', 'remote1', { ... })</text>
  <text x="323" y="734" text-anchor="middle" font-size="8.5" fill="#9f1239">'en', 'remote1', { ... })</text>
  <text x="323" y="746" text-anchor="middle" font-size="8" fill="#be185d">마운트 시 1회 실행</text>

  <!-- useTranslation 사용 -->
  <rect x="428" y="676" width="164" height="76" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
